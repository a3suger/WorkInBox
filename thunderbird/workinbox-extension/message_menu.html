<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIB操作メニュー</title>
  <link rel="stylesheet" href="message_menu.css">
</head>
<body>
  <main>
    <h1>WIB操作</h1>
    <p class="preview">メニュー構成の確認用です。現在は操作してもメールを変更しません。</p>

    <details open>
      <summary>通常フロー</summary>
      <div class="menu-items">
        <button type="button">回答必要にする</button>
        <button type="button">見る・検討にする</button>
        <button type="button">注目にする</button>
        <button type="button">Recordへ保存して終了</button>
        <button type="button">通常フローを終了</button>
      </div>
    </details>

    <details open>
      <summary>専用フロー</summary>
      <section>
        <h2>締切</h2>
        <div class="menu-items">
          <button type="button">締切登録を開始／続ける</button>
          <button type="button">このメールには締切なし</button>
        </div>
      </section>
      <section>
        <h2>スケジュール調整</h2>
        <div class="menu-items">
          <button type="button">スケジュール調整を開始／続ける</button>
          <button type="button">スケジュール調整なし</button>
        </div>
      </section>
    </details>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="message_menu.js"></script>
</body>
</html>
