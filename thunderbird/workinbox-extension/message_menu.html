<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIB操作メニュー</title>
  <link rel="stylesheet" href="message_menu.css">
</head>
<body>
  <main>
    <h1>WIB操作</h1>
    <p class="preview" id="menu-description">表示中のメールを確認しています…</p>

    <details open id="normal-menu" hidden>
      <summary>通常フロー</summary>
      <div class="menu-items">
        <button type="button" data-normal-workflow="wib-answer"><span class="check">　</span>回答必要</button>
        <button type="button" data-normal-workflow="wib-review"><span class="check">　</span>見る・検討する</button>
        <button type="button" data-normal-workflow="wib-watch"><span class="check">　</span>注目</button>
      </div>
    </details>

    <details open id="dedicated-menu" hidden>
      <summary>専用フロー</summary>
      <section>
        <h2>締切</h2>
        <div class="menu-items">
          <button type="button" data-dedicated-workflow="deadline">締切登録を開始／続ける</button>
          <button type="button" data-dismiss-dedicated-workflow="deadline">このメールには締切なし</button>
        </div>
      </section>
      <section>
        <h2>スケジュール調整</h2>
        <div class="menu-items">
          <button type="button" data-dedicated-workflow="schedule">スケジュール調整を開始／続ける</button>
          <button type="button" data-dismiss-dedicated-workflow="schedule">スケジュール調整なし</button>
        </div>
      </section>
    </details>

    <details open id="completion-menu" hidden>
      <summary>終了</summary>
      <div class="menu-items">
        <button type="button" data-completion="record">Recordに記録して終了</button>
        <button type="button" data-completion="normal">通常終了</button>
      </div>
    </details>

    <details open id="action-ready-menu" hidden>
      <summary>対応への処理</summary>
      <div class="menu-items">
        <button type="button" data-action-ready="question">追加の質問を送る</button>
        <button type="button" data-action-ready="thanks">お礼を送って終了</button>
        <button type="button" data-action-ready="finish">返信せず終了</button>
      </div>
    </details>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="message_menu.js"></script>
</body>
</html>
