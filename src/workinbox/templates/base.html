<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WorkInBox{% endblock %}</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }
    body { margin: 0; }
    header {
      background: #111827;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.35rem; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav a {
      color: white;
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 6px;
    }
    nav a.current { background: #374151; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.primary { background: #1d4ed8; border-color: #1d4ed8; color: white; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
    }
    th { background: #f1f5f9; font-size: 0.9rem; }
    td { font-size: 0.92rem; }
    .muted { color: #64748b; }
    .status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .sync-status {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
    .empty {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: #64748b;
    }
    .table-wrap { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
    .tag-cell { min-width: 310px; }
    .tag-list, .tag-controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-badge {
      border-left: 4px solid var(--tag-color);
      background: #f8fafc;
      border-radius: 5px;
      padding: 4px 7px;
      white-space: nowrap;
    }
    .tag-editor { margin-top: 8px; }
    .tag-editor summary { cursor: pointer; color: #475569; }
    .tag-controls { margin-top: 8px; }
    .tag-controls form { margin: 0; }
    button.tag-toggle {
      border-left: 4px solid var(--tag-color);
      padding: 5px 8px;
      font-size: 0.82rem;
    }
    button.tag-toggle.selected {
      background: #f1f5f9;
      font-weight: 600;
    }
    .tag-error { color: #991b1b; font-size: 0.85rem; }
    .pending-list, .deadline-list, .schedule-list { display: grid; gap: 14px; }
    .pending-card, .deadline-card, .schedule-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
    }
    .pending-card h3, .deadline-card h3, .schedule-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .pending-meta, .deadline-meta, .schedule-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .message-preview { margin: 10px 0 14px; }
    .message-preview summary { cursor: pointer; color: #475569; }
    .message-body {
      white-space: pre-wrap;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      padding: 12px;
      max-height: 360px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }
    .resolution-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .resolution-actions form { margin: 0; }
    .candidate-list { display: grid; gap: 10px; margin-top: 14px; }
    .candidate-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
    }
    .candidate-card h4 { margin: 0 0 6px; }
    .review-badge {
      display: inline-block;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
<header>
  <h1>WorkInBox</h1>
  <nav>
    <a href="/active" class="{% if active_view and not pending_view and not deadlines_view and not schedules_view %}current{% endif %}">Active</a>
    <a href="/pending" class="{% if pending_view %}current{% endif %}">判定保留</a>
    <a href="/deadlines" class="{% if deadlines_view %}current{% endif %}">締切</a>
    <a href="/schedules" class="{% if schedules_view %}current{% endif %}">スケジュール調整</a>
    <a href="/inactive" class="{% if not active_view and not pending_view and not deadlines_view and not schedules_view %}current{% endif %}">Inactive</a>
  </nav>
</header>
<main>
  <div id="wib-sync-status" class="sync-status" hidden>
    同期処理中です。画面はそのまま操作できます。<span id="wib-sync-pid"></span>
  </div>
  {% block content %}{% endblock %}
</main>
<script>
(() => {
  const status = document.getElementById("wib-sync-status");
  const pid = document.getElementById("wib-sync-pid");
  let observedRunning = false;

  const setSyncButtonsDisabled = (disabled) => {
    document.querySelectorAll('form[action="/sync"] button, form[action="/full-recheck"] button')
      .forEach((button) => { button.disabled = disabled; });
  };

  const refreshSyncStatus = async () => {
    try {
      const response = await fetch("/api/sync-status", {cache: "no-store"});
      if (!response.ok) return;
      const data = await response.json();
      if (data.running) {
        observedRunning = true;
        status.hidden = false;
        pid.textContent = data.pid ? ` (PID ${data.pid})` : "";
        setSyncButtonsDisabled(true);
        return;
      }

      status.hidden = true;
      pid.textContent = "";
      setSyncButtonsDisabled(false);
      if (observedRunning) {
        window.location.reload();
      }
    } catch (_) {
      // Status polling must never make the UI itself unusable.
    }
  };

  refreshSyncStatus();
  window.setInterval(refreshSyncStatus, 2000);
})();
</script>
</body>
</html>
