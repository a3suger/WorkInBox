[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workinbox"
version = "0.1.0"
description = "Synchronize Thunderbird-starred IMAP messages into SQLite"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.116",
    "jinja2>=3.1",
    "uvicorn>=0.35",
]

[project.scripts]
workinbox = "workinbox.main:cli"
workinbox-web = "workinbox.web:cli"
workinbox-imap-flags = "workinbox.imap_debug:cli"
workinbox-imap-deadline-tag = "workinbox.imap_tag_debug:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workinbox = ["templates/*.html"]
